<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Herramientas AZETA</title>
<style>
  :root{--bg:#0f1216;--panel:#171b21;--panel2:#1e242c;--line:#2a323c;--txt:#e7edf3;--muted:#9aa7b4;--accent:#4f8cff;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
       min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:360px}
  h1{font-size:19px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:15px}
  button{width:100%;margin-top:18px;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
  .err{background:rgba(255,107,107,.12);color:var(--err);border-radius:9px;padding:9px 11px;font-size:13px;margin-top:14px}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Herramientas AZETA</h1>
    <div class="sub">Inicia sesión para continuar</div>
    <input type="hidden" name="next" value="{{ next }}">
    <label>Usuario</label>
    <input type="text" name="username" autofocus autocomplete="username">
    <label>Contraseña</label>
    <input type="password" name="password" autocomplete="current-password">
    <button type="submit">Entrar</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
