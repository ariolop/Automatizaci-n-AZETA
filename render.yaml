# Blueprint de Render para la app UNIFICADA (menú + AZETA + CS Papelería + Escáner).
# En Render: New > Blueprint > conecta este repo. Rellena los valores marcados
# como "sync: false" (secretos) en el panel: son las credenciales y la contraseña.
#
# Rutas una vez desplegado:
#   /          -> Menú
#   /azeta     -> AZETA Manager
#   /cs        -> CS Papelería / Liderpapel
#   /escaner   -> Escáner de código de barras
services:
  - type: web
    name: herramientas-azeta
    runtime: python
    plan: free
    # rootDir = raíz del repo: el hub monta las 3 apps por prefijo.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      # --- Credenciales AZETA (rellenar en el panel) ---
      - key: AZETA_USER
        sync: false
      - key: AZETA_PASSWORD
        sync: false
      # --- Credenciales Liderpapel / CS Papelería (rellenar en el panel) ---
      - key: CS_USER
        sync: false
      - key: CS_PASS
        sync: false
      - key: CS_IMPERSONATE
        value: chrome
      - key: CS_IVA_DEFAULT
        value: "21"
      # --- PrestaShop (para publicar productos desde AZETA Manager) ---
      - key: PRESTASHOP_URL
        sync: false
      - key: PRESTASHOP_TOKEN
        sync: false
      - key: PRESTASHOP_CATEGORIA_DEFECTO
        value: "2"
      - key: PRESTASHOP_PROVEEDOR_AZETA
        sync: false
      - key: PRESTASHOP_PROVEEDOR_CS
        sync: false
      - key: PRESTASHOP_IMPUESTOS
        sync: false
      - key: APLICAR_RECARGO
        value: "1"
      # --- Autenticación por sesión (login de usuarios en Supabase) ---
      - key: AUTH_SECRET          # secreto para firmar la cookie de sesión
        sync: false
      - key: SUPABASE_USUARIOS_TABLE
        value: usuarios
      # --- Supabase (historial del escáner + monitor unificado) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY          # usa la key 'service_role' (secreta)
        sync: false
      - key: SUPABASE_TABLE
        value: escaneos
      - key: SUPABASE_VIGILADOS_TABLE
        value: vigilados
      - key: SUPABASE_VIGILADOS_HIST_TABLE
        value: vigilados_historico
