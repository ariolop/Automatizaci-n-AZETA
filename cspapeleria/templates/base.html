<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS Papelería · Liderpapel</title>
  <style>
    :root{--verde:#5aa832;--verde-d:#478024;--gris:#f4f5f7;--borde:#e2e5ea;--txt:#2b2f36}
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);background:var(--gris)}
    header{background:#fff;border-bottom:1px solid var(--borde);padding:0 20px;display:flex;align-items:center;gap:24px}
    header .brand{font-weight:700;color:var(--verde);padding:16px 0;font-size:18px}
    nav a{display:inline-block;padding:18px 10px;text-decoration:none;color:var(--txt);border-bottom:3px solid transparent}
    nav a.active,nav a:hover{color:var(--verde);border-bottom-color:var(--verde)}
    main{max-width:1080px;margin:24px auto;padding:0 20px}
    .card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:20px;margin-bottom:18px}
    input[type=text],input[type=password],input[type=number],textarea,select{
      width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;font-size:14px}
    textarea{min-height:120px;font-family:monospace}
    button,.btn{background:var(--verde);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
    button:hover,.btn:hover{background:var(--verde-d)}
    .btn-sec{background:#eef0f3;color:var(--txt)}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--borde);font-size:14px;vertical-align:middle}
    th{color:#7a808a;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
    .badge{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
    .b-ok{background:#e4f5db;color:#3d7a1e}.b-no{background:#fde8e8;color:#b42323}.b-warn{background:#fff3d9;color:#9a6b00}
    .flash{padding:12px 16px;border-radius:8px;margin-bottom:14px}
    .flash.ok{background:#e4f5db;color:#3d7a1e}.flash.error{background:#fde8e8;color:#b42323}
    .muted{color:#7a808a;font-size:13px}
    .row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}
    img.thumb{width:46px;height:46px;object-fit:contain;background:#fff;border:1px solid var(--borde);border-radius:6px}
    .grid-precio{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}
    .grid-precio div span{display:block;font-size:12px;color:#7a808a}
    .grid-precio div b{font-size:20px}
  </style>
</head>
<body>
  <header>
    <span class="brand">CS Papelería · Liderpapel</span>
    <nav>
      <a href="/">☰ Menú</a>
      <a href="{{ request.script_root }}/buscar" class="{{ 'active' if seccion=='buscar' else '' }}">Buscar</a>
      <a href="{{ request.script_root }}/lote" class="{{ 'active' if seccion=='lote' else '' }}">Lote</a>
      <a href="/monitor">Monitor</a>
      <a href="/config">Configuración</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{cat}}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
